<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Defaulters - School Admin Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../navbar/style.css">
    <style>
        .split-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        @media (max-width: 900px) {
            .split-view {
                grid-template-columns: 1fr;
            }
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        .section-header h3 {
            font-size: 1.25rem;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="page-content" style="display: none;">
        <div id="defaulters" class="page active">
            <div class="header">
                <div class="title">
                    <h2><i class="fa-solid fa-triangle-exclamation"></i> Fee Defaulters</h2>
                </div>
                <div class="actions">
                    <div class="search-bar">
                        <i class="fa-solid fa-search"></i>
                        <input type="text" id="defaulters-search" placeholder="Search students by name, ID or email...">
                    </div>
                </div>
            </div>

            <div class="split-view">
                <!-- Unpaid Students Section -->
                <div>
                    <div class="section-header">
                        <h3><i class="fa-solid fa-clock-rotate-left" style="color: #f59e0b;"></i> Unpaid Fees</h3>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="unpaid-students-body">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Defaulters List Section -->
                <div>
                    <div class="section-header">
                        <h3><i class="fa-solid fa-ban" style="color: #ef4444;"></i> Defaulters List</h3>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="defaulters-body">
                                <!-- Populated by JavaScript -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../navbar/layout.js"></script>
    <script src="../scripts/app.js"></script>
</body>
</html>
